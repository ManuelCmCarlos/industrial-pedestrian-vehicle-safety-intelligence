source:
  id: camera_01
  uri: ../project_3_cv_deployment/videos/input.mp4

model:
  path: outputs/training/baseline_02/weights/best.onnx
  confidence_threshold: 0.25
  nms_threshold: 0.45

tracking:
  track_activation_threshold: 0.60
  minimum_consecutive_frames: 2
  lost_track_buffer: 30

storage:
  database_path: data/events.db

rules:
  line_crossing:
    enabled: true
    id: entrance_line
    line_y: 750

  zone_intrusion:
    enabled: true
    id: restricted_zone
    x1: 1800
    y1: 650
    x2: 2100
    y2: 850